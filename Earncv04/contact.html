            .body{
                margin: 0;
                padding: 0;
            }    
            .contact-section{
                background-color: #030000;
                width: 100%;
                padding: 40px;
            }

            /* contact-navbar */
            .contact-navbar{
                display: flex;
                justify-content: space-between;
                align-items: center;
    
                
            }
            .contact-navbar h1{
                font-family: Inter;
                font-size: 40px;
                font-weight: 700;
                color: #FFFFFF;
                margin-left: 50px;
            }
            .contact-navbar a{
                font-family: Inter;
                font-size: 20px;
                font-weight: 600;
                color: #FFFFFF;
            }
            .contact-navbar #contact{
                color: #FFE207;
            }
            .contact-navbar a:hover{
                color: #FFE207;
            }
            .contact-navbar button{
                font-family: Inter;
                font-size: 20px;
                font-weight: 600;
                color: #FFFFFF;
                border: 1px solid#FFFFFF;
                border-radius: 30px;
                background: transparent;
                padding: 10px 30px;
                margin-right: 100px;
            }

            /* contact-title */
            .contact-title{
                margin-top: 50px;
            }
            .contact-title h1{
                margin-left: 100px;
                font-family: Lora;
                font-size: 40px;
                font-weight: 600;
                color: #FFFFFF;
            }
            .contact-title h3{
                text-align: center;
                font-family: Lora;
                font-size: 30px;
                font-weight: 600;
                color: #FFFFFF;
            }
            .contact-title p{
                text-align: center;
                font-family: Inter;
                font-size: 30px;
                font-weight: 600;
                color: #ffffff70;
            }

            /* contact-footer */
            .contact-footer{
                margin-top: 150px;
                display: flex;
                flex-direction: column;
                /* justify-content: space-between; */
            }
           
            .contact-footer p{
                font-family: Inter;
                font-size: 20px;
                font-weight: 600;
                color: #ffffff81;
                margin-top: 0;
            }
            .contact-footer .icon{
                display: flex;
                justify-content: space-around;
            }
           
            .contact-footer .contact{
                display: flex;
                justify-content: space-around;
                align-items: center;
            }
            .contact-footer .contact #address{
                margin-right: 150px;
            }
            .contact-footer .contact #contact{
                margin-right: 50px;

            }

    <div class="contact-section">
        <div class="contact-navbar">
            <h1>Earn SAU</h1>
            <a href="./index.html">Home</a>
            <a href="./aboutus.html">About</a>
            <a href="./portfolio.html">Portfolio</a>
            <a href="./contact.html">
                <button id="contact">Let’s talk</button>
            </a>
        </div>

        <div class="contact-title">
            <h1>Contact</h1>
            <h3>Let's Connect</h3>
            <p>Don't be a stranger! Say hello and let's collaborate</p>
        </div>

    <div class="contact-footer">
        <div class="icon">
            <img src="./images/email-Icon.png" alt="email-Icon">
             <img src="./images/address-icon.png" alt="address-icon">
             <img src="./images/contact-icon.png" alt="contact">
        </div>
        <div class="contact">
            <p id="email">6852D10009@hmail.com</p>
            <p id="address">Thailand,Bangkok</p>
            <p id="contact">Earn SAU</p>
