<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earn CV V.2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    @import url("https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap");

    body {
      margin: 0px;
      padding: 0px;
      background-color: #000000;
    }

    .navbar-section {
      display: flex;
      background-color: #1b1b1b;
      width: 80%;
      padding: 20px 50px;
      margin: auto;
    }

    .menu-bar {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .menu-bar a {
      font-family: 'IBM Plex Mono';
      text-decoration: none;
      color: #b8b5b5;
      margin: 0px 40px;
    }

    .menu-bar a:hover {
      color: #0cf02a;
    }

    .icon-bar i {
      color: #b8b5b5;
      margin: 0px 10px;
    }

    .icon-bar a i:hover {
      color: #0cf02a;
    }

    /* ตกแต่งContent Section */
    .content-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      align-items: flex-start;
    }

    .text {
      padding-top: 150px;
      padding-left: 280px;
      gap: 30px;
      text-align: left;
      position: relative;
    }

    .text button {
      display: inline-block;
      margin-top: 20px;
    }

    h1 {
      font-family: Raleway;
      font-size: 44px;
      color: #ffff;
    }

    #a {
      font-family: IBM Plex Mono;
      font-size: 14px;
      font-weight: 400;
      color: #9C9C9C;
      max-width: 492px;
      max-height: 96px;
      gap: 10px;
    }

    #b {
      font-family: IBM Plex Mono;
      font-size: 14px;
      font-weight: 400;
      color: #ffff;
      padding-top: 200px;
      gap: 10px;
    }

    .btn-section {
      display: flex;
    }

    button {
      font-family: IBM Plex Mono;
      font-size: 16px;
      font-weight: 700;
      color: #ffff;
      background-color: #3F8E00;
      border: 1px solid#62BA1B;
      border-radius: 4px;
      padding-top: 21px;
      padding-right: 64px;
      padding-bottom: 21px;
      padding-left: 64px;
    }

    .img-show {
      flex: 1;
      display: flex;
      justify-content: center;
      padding-top: 100px;

    }

    .img-show img {
      width: 350px;
      height: 350px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
    }

    /* ตกแต่งfooter section */
    .footer-section {
      display: flex;
      flex-direction: column;
      margin-bottom: 5px;
      padding: 0px 130px;
    }

    .logo-bar {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      position: absolute;
      top: 45%;
      left: 190px;
      width: 80%;
      margin-top: 400px;
    }

    .logo-bar img {
      border: 1px solid#1B1B1B;
      border-radius: 4px;
      width: 80px;
      height: 30px;
      padding: 15px 30px;

    }
  </style>
</head>

<body>
  <!-- navbar-section -->
  <div class="navbar-section">
    <div class="menu-bar">
      <a href="#">Home</a>
      <a href="#">Case Studies</a>
      <a href="#">Testimonials</a>
      <a href="#">Recent Work</a>
      <a href="#">Get int Touch</a>
    </div>
    <div class="icon-bar">
      <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="#"><i class="fa-brands fa-behance"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
    </div>
  </div>

  <!-- content-section  -->
  <div class="content-section">

    <div class="text">
      <h1>Patcharin Thonglam</h1>
      <h3 id="a">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt rem odit labore unde nemo omnis sequi
        hic sit laudantium repellendus recusandae vitae ea laborum, ipsa nisi eos autem.</h3>

      <div class="btn-section">
        <button>Let's get started &gt;</button>
      </div>

      <h3 id="b">Worked with</h3>
    </div>

    <div class="img-show">
      <img src="./images/me.JPG" alt="">
    </div>
  </div>


  <!-- footer-section -->
  <div class="footer-section">
    <div class="logo-bar">
      <div><img src="./images/clickup.png" alt="clickup"></div>
      <div><img src="./images/dropbox.png" alt="dropbox"></div>
      <div><img src="./images/paychex.png" alt="paychex"></div>
      <div><img src="./images/elastic.png" alt="elastic"></div>
      <div><img src="./images/stripe.png" alt="stripe"></div>

    </div>
  </div>

</body>

</html>
